name: Coverage badge

# Publishes the unit-test coverage % as a shields.io endpoint JSON on the `badges`
# branch; the README's coverage badge reads it from raw.githubusercontent.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-badge
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 'v22.22.2'

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests with coverage
        run: >-
          ulimit -n 65536 &&
          pnpm exec vitest run --config configs/vitest.config.ts
          --coverage --coverage.reporter=json-summary
      - name: Build badge JSON
        run: |
          node -e '
            const pct = require("./coverage/coverage-summary.json").total.statements.pct;
            const colors = [[90, "brightgreen"], [80, "green"], [70, "yellowgreen"], [60, "yellow"], [50, "orange"]];
            const color = (colors.find(([min]) => pct >= min) ?? [0, "red"])[1];
            const badge = { schemaVersion: 1, label: "coverage", message: `${pct}%`, color };
            require("fs").writeFileSync("coverage-badge.json", JSON.stringify(badge) + "\n");
            console.log(badge);
          '
      - name: Publish badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp coverage-badge.json "$RUNNER_TEMP/coverage.json"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            git checkout -f -B badges FETCH_HEAD
          else
            git checkout --orphan badges
          fi
          git rm -rf --quiet . 2>/dev/null || true
          git clean -fdxq
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Badge unchanged; nothing to push."
            exit 0
          fi
          git commit -m "chore: update coverage badge"
          git push origin badges
